name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Test and build
        run: ./gradlew testDebugUnitTest assembleRelease --console=plain
      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk GymTracker.apk
      - uses: actions/upload-artifact@v4
        with:
          name: GymTracker-apk
          path: GymTracker.apk
      - name: Publish as "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest GymTracker.apk --prerelease --target "$GITHUB_SHA" \
            --title "Gym Tracker (latest build)" \
            --notes "Built from ${GITHUB_REF_NAME} @ ${GITHUB_SHA::7}. Download GymTracker.apk on your phone and install it."
